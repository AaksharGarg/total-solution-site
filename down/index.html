<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Total Solution — Temporarily Offline</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 80% -10%, rgba(202,162,90,.25), transparent 60%),
               linear-gradient(160deg,#0d0f30,#171a4d 55%,#272b6e);
    color:#fff;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;text-align:center;padding:24px;
  }
  .card{max-width:520px}
  .om{
    width:64px;height:64px;border-radius:50%;margin:0 auto 24px;
    background:radial-gradient(circle at 35% 30%, #e6c27f, #caa25a 70%);
    display:grid;place-items:center;color:#0d0f30;font-size:32px;font-weight:700;
    font-family:'Tiro Devanagari Hindi',serif;
  }
  h1{font-family:'Playfair Display',serif;font-size:clamp(24px,4vw,32px);margin:0 0 14px}
  p{color:rgba(255,255,255,.78);line-height:1.7;font-size:15.5px;margin:0}
  .hin{font-family:'Noto Sans Devanagari',sans-serif;display:block;margin-top:10px;color:#e6c27f}
</style>
</head>
<body>
  <div class="card">
    <div class="om">ॐ</div>
    <h1>Total Solution is temporarily offline</h1>
    <p>We're away from the desk right now — the site will be back shortly. Thanks for your patience.</p>
    <span class="hin">जल्द ही वापस आएंगे</span>
  </div>
</body>
</html>
